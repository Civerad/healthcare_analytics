version: 2

models:
  - name: dim_patient
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: patient_full_name
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              values: ['Male', 'Female']
      - name: blood_type
        tests:
          - accepted_values:
              values: ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-']
